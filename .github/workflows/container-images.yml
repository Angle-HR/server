name: Container Images

on:
  push:
    branches:
      - feat/kubernetes-config
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/angle-hr/server
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata (server)
        id: meta_server
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Docker metadata (email-worker)
        id: meta_email_worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-email-worker
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Docker metadata (upload-worker)
        id: meta_upload_worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-upload-worker
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Docker metadata (migrate)
        id: meta_migrate
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-migrate
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: server
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta_server.outputs.tags }}
          labels: ${{ steps.meta_server.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push email-worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: email-worker
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta_email_worker.outputs.tags }}
          labels: ${{ steps.meta_email_worker.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push upload-worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: upload-worker
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta_upload_worker.outputs.tags }}
          labels: ${{ steps.meta_upload_worker.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.migrate
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta_migrate.outputs.tags }}
          labels: ${{ steps.meta_migrate.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
