# Builds the service, jobs and migrate images and pushes them to the environment's ECR.
#
# GitHub Environment setup (Settings → Environments), one per AWS account:
#
#   staging     — used when pushing to the staging branch
#   production  — used when pushing to the production branch
#
# Each environment needs two values (Variables or Secrets; Variables keep them readable in logs):
#   AWS_DEPLOY_ROLE_ARN — `terraform output github_deploy_role_arn` in Angle-HR/infra envs/<env>
#   AWS_REGION          — the stack's home region, e.g. eu-west-2
#
# Images are tagged with the full git sha only. ECR tags are immutable, so there is no `latest`.
#
# Rollout: when the environment has the variable AUTO_ROLLOUT=true, the job then runs migrations and points the
# ECS services and job schedules at the new sha (scripts/ci/rollout.sh). It also needs ECS_CLUSTER,
# MIGRATE_TASK_DEFINITION, MIGRATE_SUBNETS, MIGRATE_SECURITY_GROUP (see migrate.yml) and SCHEDULE_PREFIX
# (e.g. openhr-staging-), and the deploy role needs `rollout` set in Angle-HR/infra. Without AUTO_ROLLOUT,
# `terraform apply` in Angle-HR/infra envs/<env> rolls out the newest sha in ECR.

name: Container Images

on:
  push:
    branches:
      - staging
      - production
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  id-token: write # OIDC login to AWS

concurrency:
  group: images-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push (${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }})
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }}
    env:
      # Fargate task definitions use X86_64.
      PLATFORMS: linux/amd64
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN || secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # A re-run for the same commit would fail on the immutable tag; skip images that already exist.
      - name: Check existing images
        id: exists
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          for image in jobs migrate; do
            key="$(echo "$image" | tr '-' '_')"
            if docker buildx imagetools inspect "$REGISTRY/openhr/$image:$TAG" >/dev/null 2>&1; then
              echo "$image:$TAG already in ECR; skipping"
              echo "$key=true" >> "$GITHUB_OUTPUT"
            else
              echo "$key=false" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Build and push jobs
        if: steps.exists.outputs.jobs != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: jobs
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/openhr/jobs:${{ env.TAG }}
          cache-from: type=gha,scope=jobs
          cache-to: type=gha,mode=max,scope=jobs

      - name: Build and push migrate
        if: steps.exists.outputs.migrate != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.migrate
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/openhr/migrate:${{ env.TAG }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

      # The split services share one Dockerfile (deploy/local/Dockerfile.service), one image per cmd/<service>.
      - name: Build and push services
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          for svc in identity org hiring applications notifications web-bff admin-bff; do
            ref="$REGISTRY/openhr/$svc:$TAG"
            if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
              echo "$svc:$TAG already in ECR; skipping"
              continue
            fi
            docker buildx build --platform "$PLATFORMS" --file deploy/local/Dockerfile.service \
              --build-arg "SERVICE=$svc" --tag "$ref" \
              --cache-from "type=gha,scope=svc-$svc" --cache-to "type=gha,mode=max,scope=svc-$svc" \
              --push .
          done

      - name: Roll out
        if: vars.AUTO_ROLLOUT == 'true'
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER || secrets.ECS_CLUSTER }}
          MIGRATE_TASK_DEFINITION: ${{ vars.MIGRATE_TASK_DEFINITION || secrets.MIGRATE_TASK_DEFINITION }}
          MIGRATE_SUBNETS: ${{ vars.MIGRATE_SUBNETS || secrets.MIGRATE_SUBNETS }}
          MIGRATE_SECURITY_GROUP: ${{ vars.MIGRATE_SECURITY_GROUP || secrets.MIGRATE_SECURITY_GROUP }}
          SCHEDULE_PREFIX: ${{ vars.SCHEDULE_PREFIX }}
        run: scripts/ci/rollout.sh

      - name: Summary
        env:
          ROLLED_OUT: ${{ vars.AUTO_ROLLOUT == 'true' }}
        run: |
          {
            echo "### Images for \`${TAG}\`"
            echo
            if [[ "$ROLLED_OUT" == "true" ]]; then
              echo "Rolled out to ECS (migrations, services, job schedules)."
            else
              echo "Not rolled out: run \`terraform apply\` in Angle-HR/infra envs/${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }} (it picks the newest sha), or set AUTO_ROLLOUT=true on the environment."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
