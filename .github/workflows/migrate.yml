# Runs database migrations on push to staging and production.
#
# GitHub Environment setup (Settings → Environments):
#
#   staging     — used when pushing to the staging branch
#   production  — used when pushing to the production branch
#
# Each environment needs these secrets (same names, different DSNs per env):
#   ANGLEHR_UK_POSTGRES_DSN, ANGLEHR_US_POSTGRES_DSN, ANGLEHR_AFRICA_POSTGRES_DSN,
#   ANGLEHR_EU_POSTGRES_DSN, ANGLEHR_ASIA_POSTGRES_DSN, DB_URL_GLOBAL
#
# Optional: enable Required reviewers on production; restrict each environment
# to its deployment branch (staging → staging, production → production).

name: Database Migrations

on:
  push:
    branches:
      - production
      - staging
    paths:
      - "db/migrations/**/*.sql"

concurrency:
  group: migrate-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate (${{ github.ref_name }})
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'production' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run all migrations
        env:
          ANGLEHR_UK_POSTGRES_DSN: ${{ secrets.ANGLEHR_UK_POSTGRES_DSN }}
          ANGLEHR_US_POSTGRES_DSN: ${{ secrets.ANGLEHR_US_POSTGRES_DSN }}
          ANGLEHR_AFRICA_POSTGRES_DSN: ${{ secrets.ANGLEHR_AFRICA_POSTGRES_DSN }}
          ANGLEHR_EU_POSTGRES_DSN: ${{ secrets.ANGLEHR_EU_POSTGRES_DSN }}
          ANGLEHR_ASIA_POSTGRES_DSN: ${{ secrets.ANGLEHR_ASIA_POSTGRES_DSN }}
          DB_URL_GLOBAL: ${{ secrets.DB_URL_GLOBAL }}
          MIGRATE_COMPARE_REF: ${{ github.event.before }}
        run: bash db/migrations/migrate-all.sh up
