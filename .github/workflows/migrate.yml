# Runs database migrations as a one-off ECS task inside the environment's VPC (RDS is private), started
# manually from the Actions tab (Run workflow).
#
# The task runs the migrate image Terraform deployed (`image_tag` in envs/<env>/terraform.tfvars in Angle-HR/infra), so the
# order for a release with new migrations is: push (Container Images builds the sha) → set image_tag and
# `terraform apply` → run this workflow. The run fails if the deployed image is not the one you expect.
#
# GitHub Environment setup (Settings → Environments → Variables or Secrets), from `terraform output migrate_run_task` and
# `terraform output github_deploy_role_arn` in Angle-HR/infra envs/<env>:
#
#   AWS_DEPLOY_ROLE_ARN      — github_deploy_role_arn
#   AWS_REGION               — e.g. eu-west-2
#   ECS_CLUSTER              — migrate_run_task.cluster
#   MIGRATE_TASK_DEFINITION  — migrate_run_task.task_definition (the family; the latest revision runs)
#   MIGRATE_SUBNETS          — migrate_run_task.subnets, comma-separated
#   MIGRATE_SECURITY_GROUP   — migrate_run_task.security_group
#
# Optional: enable Required reviewers on production; restrict each environment to its deployment branch
# (staging → staging, production → production).

name: Database Migrations

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - production
      expected_sha:
        description: Fail unless the deployed migrate image is tagged with this commit sha (blank = no check)
        required: false
        type: string

permissions:
  contents: read
  id-token: write # OIDC login to AWS

concurrency:
  group: migrate-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      CLUSTER: ${{ vars.ECS_CLUSTER || secrets.ECS_CLUSTER }}
      FAMILY: ${{ vars.MIGRATE_TASK_DEFINITION || secrets.MIGRATE_TASK_DEFINITION }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN || secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION }}

      - name: Check the deployed migrate image
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          image="$(aws ecs describe-task-definition --task-definition "$FAMILY" \
            --query 'taskDefinition.containerDefinitions[0].image' --output text)"
          echo "Migrate image: $image"
          if [[ -n "${EXPECTED_SHA}" && "${image##*:}" != "${EXPECTED_SHA}" ]]; then
            echo "Deployed migrate image is ${image##*:}, expected ${EXPECTED_SHA}. Set image_tag and terraform apply first." >&2
            exit 1
          fi

      - name: Run migrate task
        id: run
        env:
          SUBNETS: ${{ vars.MIGRATE_SUBNETS || secrets.MIGRATE_SUBNETS }}
          SECURITY_GROUP: ${{ vars.MIGRATE_SECURITY_GROUP || secrets.MIGRATE_SECURITY_GROUP }}
        run: |
          set -euo pipefail
          task_arn="$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$FAMILY" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${SUBNETS}],securityGroups=[${SECURITY_GROUP}],assignPublicIp=DISABLED}" \
            --started-by "github-${GITHUB_RUN_ID}" \
            --query 'tasks[0].taskArn' --output text)"
          if [[ -z "$task_arn" || "$task_arn" == "None" ]]; then
            echo "run-task did not start a task" >&2
            exit 1
          fi
          echo "Started $task_arn"
          echo "task_arn=$task_arn" >> "$GITHUB_OUTPUT"

      - name: Wait for the task to stop
        env:
          TASK_ARN: ${{ steps.run.outputs.task_arn }}
        run: |
          set -euo pipefail
          # The default waiter gives up after 10 minutes; migrations across six databases can take longer.
          for _ in 1 2 3; do
            if aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"; then
              exit 0
            fi
          done
          echo "Task still running after 30 minutes" >&2
          exit 1

      - name: Print logs and check the exit code
        if: always() && steps.run.outputs.task_arn != ''
        env:
          TASK_ARN: ${{ steps.run.outputs.task_arn }}
        run: |
          set -euo pipefail
          task_id="${TASK_ARN##*/}"
          # awslogs-stream-prefix "job" / container name (= family) / task id; see modules/ecs_job in Angle-HR/infra.
          aws logs get-log-events \
            --log-group-name "/ecs/${FAMILY}" \
            --log-stream-name "job/${FAMILY}/${task_id}" \
            --start-from-head --query 'events[].message' --output text | tr '\t' '\n' || echo "(no logs found)"

          read -r exit_code reason < <(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].[containers[0].exitCode, stoppedReason]' --output text)
          echo "Exit code: ${exit_code}; stopped reason: ${reason}"
          if [[ "$exit_code" != "0" ]]; then
            exit 1
          fi
