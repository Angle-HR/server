version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/Angle-HR/server/gen
plugins:
  # Local plugins pinned by the `tool` directives in go.mod: no network needed.
  - local: [go, tool, protoc-gen-go]
    out: gen
    opt: paths=source_relative
  - local: [go, tool, protoc-gen-go-grpc]
    out: gen
    opt: paths=source_relative
