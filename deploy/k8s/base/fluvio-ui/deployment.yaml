apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluvio-ui
  labels:
    app.kubernetes.io/name: fluvio-ui
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: anglehr
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fluvio-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluvio-ui
        app.kubernetes.io/component: ui
        app.kubernetes.io/part-of: anglehr
    spec:
      containers:
        - name: fluvio-ui
          image: ghcr.io/software78/fluvio_ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
