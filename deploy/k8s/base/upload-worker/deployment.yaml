apiVersion: apps/v1
kind: Deployment
metadata:
  name: upload-worker
  labels:
    app.kubernetes.io/name: upload-worker
    app.kubernetes.io/component: upload-worker
    app.kubernetes.io/part-of: anglehr
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: upload-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: upload-worker
        app.kubernetes.io/component: upload-worker
        app.kubernetes.io/part-of: anglehr
    spec:
      containers:
        - name: upload-worker
          image: ghcr.io/angle-hr/server-upload-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: anglehr-config
            - secretRef:
                name: anglehr-secrets
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - kill -0 1
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
