apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  labels:
    app.kubernetes.io/name: migrate
    app.kubernetes.io/component: init
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
        app.kubernetes.io/component: init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: ghcr.io/angle-hr/server-migrate:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: FORCE_MIGRATE
              value: "1"
          envFrom:
            - secretRef:
                name: anglehr-secrets
