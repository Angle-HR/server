apiVersion: batch/v1
kind: Job
metadata:
  name: minio-setup
  labels:
    app.kubernetes.io/name: minio-setup
    app.kubernetes.io/component: init
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-setup
        app.kubernetes.io/component: init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: minio-setup
          image: minio/mc:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: anglehr-secrets
          command:
            - /bin/sh
            - -c
            - |
              set -e
              mc alias set uk http://minio-uk:9000 "$MINIO_ROOT_USER_UK" "$MINIO_ROOT_PASSWORD_UK"
              mc mb --ignore-existing uk/anglehr-uk
              mc alias set us http://minio-us:9000 "$MINIO_ROOT_USER_US" "$MINIO_ROOT_PASSWORD_US"
              mc mb --ignore-existing us/anglehr-us
              mc alias set africa http://minio-africa:9000 "$MINIO_ROOT_USER_AFRICA" "$MINIO_ROOT_PASSWORD_AFRICA"
              mc mb --ignore-existing africa/anglehr-africa
              mc alias set eu http://minio-eu:9000 "$MINIO_ROOT_USER_EU" "$MINIO_ROOT_PASSWORD_EU"
              mc mb --ignore-existing eu/anglehr-eu
