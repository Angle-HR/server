apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio-uk
  labels:
    app.kubernetes.io/name: minio-uk
    app.kubernetes.io/component: object-storage
spec:
  serviceName: minio-uk
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio-uk
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-uk
        app.kubernetes.io/component: object-storage
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: anglehr-secrets
                  key: MINIO_ROOT_USER_UK
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anglehr-secrets
                  key: MINIO_ROOT_PASSWORD_UK
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 15
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: minio-uk
  labels:
    app.kubernetes.io/name: minio-uk
    app.kubernetes.io/component: object-storage
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: minio-uk
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console
