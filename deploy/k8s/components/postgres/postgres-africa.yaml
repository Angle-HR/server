apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-africa
  labels:
    app.kubernetes.io/name: postgres-africa
    app.kubernetes.io/component: database
spec:
  serviceName: postgres-africa
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-africa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-africa
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: anglehr
            - name: POSTGRES_DB
              value: anglehr_africa
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anglehr-secrets
                  key: POSTGRES_PASSWORD_AFRICA
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - anglehr
                - -d
                - anglehr_africa
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - anglehr
                - -d
                - anglehr_africa
            initialDelaySeconds: 15
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-africa
  labels:
    app.kubernetes.io/name: postgres-africa
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres-africa
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
