apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: anglehr
  labels:
    app.kubernetes.io/part-of: anglehr
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # Fluvio UI uses same-origin /fluvio/api/* (SSE events stream).
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
spec:
  ingressClassName: nginx
  rules:
    - host: api.anglehr.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: server
                port:
                  number: 8080
    - host: fluvio.anglehr.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fluvio-ui
                port:
                  number: 80
