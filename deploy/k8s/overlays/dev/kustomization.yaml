apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ingress.yaml

patches:
  - path: configmap.yaml
  - path: email-worker-patch.yaml
  - path: upload-worker-patch.yaml
  - path: fluvio-ui-patch.yaml

images:
  - name: ghcr.io/angle-hr/server
    newTag: dev
  - name: ghcr.io/angle-hr/server-email-worker
    newTag: dev
  - name: ghcr.io/angle-hr/server-upload-worker
    newTag: dev
  - name: ghcr.io/software78/fluvio_ui
    newName: ghcr.io/angle-hr/fluvio-ui
    newTag: dev
