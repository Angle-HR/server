# Template only — do NOT apply this file directly.
# Use: deploy/scripts/create-dev-secret.sh (reads .env and creates anglehr-secrets)
# Or create the secret manually from your secret manager in production.
#
# Required keys (stringData):
#
# PostgreSQL (single in-cluster instance with multiple databases):
#   POSTGRES_PASSWORD
#
# Cloudflare R2 (shared):
#   R2_ACCESS_KEY, R2_SECRET_KEY
#   R2_ENDPOINT (shared S3 API host for all regions)
#
# Migration job / server (dev hostnames — create-dev-secret.sh builds these automatically):
#   ANGLEHR_UK_POSTGRES_DSN, ANGLEHR_US_POSTGRES_DSN, ANGLEHR_AFRICA_POSTGRES_DSN,
#   ANGLEHR_EU_POSTGRES_DSN, ANGLEHR_ASIA_POSTGRES_DSN, DB_URL_GLOBAL
#
# Server / workers:
#   REDIS_URL (required by server; use redis://redis:6379/<db> in-cluster)
#   JWT_SECRET (required by server for auth tokens; dev default is fine locally)
#   ADMIN_BOOTSTRAP_EMAIL, ADMIN_BOOTSTRAP_PASSWORD, ADMIN_BOOTSTRAP_NAME (optional; seeds first superadmin)
#   DB_URL_GLOBAL
#   ANGLEHR_UK_POSTGRES_DSN, ANGLEHR_UK_R2_BUCKET
#   ANGLEHR_US_POSTGRES_DSN, ANGLEHR_US_R2_BUCKET
#   ANGLEHR_AFRICA_POSTGRES_DSN, ANGLEHR_AFRICA_R2_BUCKET
#   ANGLEHR_EU_POSTGRES_DSN, ANGLEHR_EU_R2_BUCKET
#   ANGLEHR_ASIA_POSTGRES_DSN, ANGLEHR_ASIA_R2_BUCKET
#
# Worker SMTP:
#   SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, SMTP_FROM, SMTP_FROM_NAME, APP_URL, ADMIN_APP_URL
#
apiVersion: v1
kind: Secret
metadata:
  name: anglehr-secrets
  namespace: anglehr
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me
  R2_ACCESS_KEY: REPLACE
  R2_SECRET_KEY: REPLACE
  R2_ENDPOINT: https://YOUR_ACCOUNT_ID.r2.cloudflarestorage.com
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: dev-insecure-jwt-secret-change-me
  ADMIN_BOOTSTRAP_EMAIL: admin@anglehr.local
  ADMIN_BOOTSTRAP_PASSWORD: changeme123
  ADMIN_BOOTSTRAP_NAME: Bootstrap Admin
  DB_URL_GLOBAL: postgres://anglehr:change-me@postgres:5432/anglehr_global?sslmode=disable
  ANGLEHR_UK_POSTGRES_DSN: postgres://anglehr:change-me@postgres:5432/anglehr_uk?sslmode=disable
  ANGLEHR_UK_R2_BUCKET: anglehr-uk
  ANGLEHR_US_POSTGRES_DSN: postgres://anglehr:change-me@postgres:5432/anglehr_us?sslmode=disable
  ANGLEHR_US_R2_BUCKET: anglehr-us
  ANGLEHR_AFRICA_POSTGRES_DSN: postgres://anglehr:change-me@postgres:5432/anglehr_africa?sslmode=disable
  ANGLEHR_AFRICA_R2_BUCKET: anglehr-africa
  ANGLEHR_EU_POSTGRES_DSN: postgres://anglehr:change-me@postgres:5432/anglehr_eu?sslmode=disable
  ANGLEHR_EU_R2_BUCKET: anglehr-eu
  ANGLEHR_ASIA_POSTGRES_DSN: postgres://anglehr:change-me@postgres:5432/anglehr_asia?sslmode=disable
  ANGLEHR_ASIA_R2_BUCKET: anglehr-asia
  SMTP_HOST: smtp.example.com
  SMTP_PORT: "587"
  SMTP_USER: no-reply@example.com
  SMTP_PASSWORD: change-me-smtp
  SMTP_FROM: no-reply@anglehr.com
  SMTP_FROM_NAME: Angle HR
  APP_URL: http://app.anglehr.local
  ADMIN_APP_URL: http://admin.anglehr.local
