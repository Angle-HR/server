# Template only — do NOT apply this file directly.
# Use: deploy/scripts/create-dev-secret.sh (reads .env and creates anglehr-secrets)
# Or create the secret manually from your secret manager in production.
#
# Required keys (stringData):
#
# PostgreSQL passwords (used by in-cluster Postgres StatefulSets in dev):
#   POSTGRES_PASSWORD_UK
#   POSTGRES_PASSWORD_US
#   POSTGRES_PASSWORD_AFRICA
#   POSTGRES_PASSWORD_EU
#   POSTGRES_PASSWORD_GLOBAL
#
# MinIO root credentials (dev in-cluster MinIO):
#   MINIO_ROOT_USER_UK, MINIO_ROOT_PASSWORD_UK
#   MINIO_ROOT_USER_US, MINIO_ROOT_PASSWORD_US
#   MINIO_ROOT_USER_AFRICA, MINIO_ROOT_PASSWORD_AFRICA
#   MINIO_ROOT_USER_EU, MINIO_ROOT_PASSWORD_EU
#
# Migration job URLs (dev hostnames — create-dev-secret.sh builds these automatically):
#   DB_URL_UK, DB_URL_US, DB_URL_AFRICA, DB_URL_EU, DB_URL_GLOBAL
#
# Server / worker:
#   DB_URL_GLOBAL
#   ANGLEHR_UK_POSTGRES_DSN, ANGLEHR_UK_MINIO_ENDPOINT, ANGLEHR_UK_MINIO_ACCESS_KEY,
#     ANGLEHR_UK_MINIO_SECRET_KEY, ANGLEHR_UK_MINIO_BUCKET
#   ANGLEHR_US_POSTGRES_DSN, ANGLEHR_US_MINIO_ENDPOINT, ANGLEHR_US_MINIO_ACCESS_KEY,
#     ANGLEHR_US_MINIO_SECRET_KEY, ANGLEHR_US_MINIO_BUCKET
#   ANGLEHR_AFRICA_POSTGRES_DSN, ANGLEHR_AFRICA_MINIO_ENDPOINT, ANGLEHR_AFRICA_MINIO_ACCESS_KEY,
#     ANGLEHR_AFRICA_MINIO_SECRET_KEY, ANGLEHR_AFRICA_MINIO_BUCKET
#   ANGLEHR_EU_POSTGRES_DSN, ANGLEHR_EU_MINIO_ENDPOINT, ANGLEHR_EU_MINIO_ACCESS_KEY,
#     ANGLEHR_EU_MINIO_SECRET_KEY, ANGLEHR_EU_MINIO_BUCKET
#
# Worker SMTP:
#   SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, SMTP_FROM, APP_URL
#
apiVersion: v1
kind: Secret
metadata:
  name: anglehr-secrets
  namespace: anglehr
type: Opaque
stringData:
  POSTGRES_PASSWORD_UK: change-me-uk
  POSTGRES_PASSWORD_US: change-me-us
  POSTGRES_PASSWORD_AFRICA: change-me-africa
  POSTGRES_PASSWORD_EU: change-me-eu
  POSTGRES_PASSWORD_GLOBAL: change-me-global
  MINIO_ROOT_USER_UK: minio_uk_user
  MINIO_ROOT_PASSWORD_UK: change-me-minio-uk
  MINIO_ROOT_USER_US: minio_us_user
  MINIO_ROOT_PASSWORD_US: change-me-minio-us
  MINIO_ROOT_USER_AFRICA: minio_africa_user
  MINIO_ROOT_PASSWORD_AFRICA: change-me-minio-africa
  MINIO_ROOT_USER_EU: minio_eu_user
  MINIO_ROOT_PASSWORD_EU: change-me-minio-eu
  DB_URL_UK: postgres://anglehr:change-me-uk@postgres-uk:5432/anglehr_uk?sslmode=disable
  DB_URL_US: postgres://anglehr:change-me-us@postgres-us:5432/anglehr_us?sslmode=disable
  DB_URL_AFRICA: postgres://anglehr:change-me-africa@postgres-africa:5432/anglehr_africa?sslmode=disable
  DB_URL_EU: postgres://anglehr:change-me-eu@postgres-eu:5432/anglehr_eu?sslmode=disable
  DB_URL_GLOBAL: postgres://anglehr:change-me-global@postgres-global:5432/anglehr_global?sslmode=disable
  ANGLEHR_UK_POSTGRES_DSN: postgres://anglehr:change-me-uk@postgres-uk:5432/anglehr_uk?sslmode=disable
  ANGLEHR_UK_MINIO_ENDPOINT: minio-uk:9000
  ANGLEHR_UK_MINIO_ACCESS_KEY: minio_uk_user
  ANGLEHR_UK_MINIO_SECRET_KEY: change-me-minio-uk
  ANGLEHR_UK_MINIO_BUCKET: anglehr-uk
  ANGLEHR_US_POSTGRES_DSN: postgres://anglehr:change-me-us@postgres-us:5432/anglehr_us?sslmode=disable
  ANGLEHR_US_MINIO_ENDPOINT: minio-us:9000
  ANGLEHR_US_MINIO_ACCESS_KEY: minio_us_user
  ANGLEHR_US_MINIO_SECRET_KEY: change-me-minio-us
  ANGLEHR_US_MINIO_BUCKET: anglehr-us
  ANGLEHR_AFRICA_POSTGRES_DSN: postgres://anglehr:change-me-africa@postgres-africa:5432/anglehr_africa?sslmode=disable
  ANGLEHR_AFRICA_MINIO_ENDPOINT: minio-africa:9000
  ANGLEHR_AFRICA_MINIO_ACCESS_KEY: minio_africa_user
  ANGLEHR_AFRICA_MINIO_SECRET_KEY: change-me-minio-africa
  ANGLEHR_AFRICA_MINIO_BUCKET: anglehr-africa
  ANGLEHR_EU_POSTGRES_DSN: postgres://anglehr:change-me-eu@postgres-eu:5432/anglehr_eu?sslmode=disable
  ANGLEHR_EU_MINIO_ENDPOINT: minio-eu:9000
  ANGLEHR_EU_MINIO_ACCESS_KEY: minio_eu_user
  ANGLEHR_EU_MINIO_SECRET_KEY: change-me-minio-eu
  ANGLEHR_EU_MINIO_BUCKET: anglehr-eu
  SMTP_HOST: smtp.example.com
  SMTP_PORT: "587"
  SMTP_USER: no-reply@example.com
  SMTP_PASSWORD: change-me-smtp
  SMTP_FROM: Angle HR <no-reply@anglehr.com>
  APP_URL: http://app.anglehr.local
