apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ingress.yaml
  - hpa.yaml

patches:
  - path: configmap.yaml
  - path: server-patch.yaml
  - path: worker-patch.yaml

images:
  - name: ghcr.io/angle-hr/server
    newTag: latest
  - name: ghcr.io/angle-hr/server-worker
    newTag: latest
