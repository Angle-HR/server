# Production secret template — replace placeholder values with managed service credentials.
# Do NOT commit real secrets. Prefer External Secrets Operator or your cloud secret store.
#
# Managed PostgreSQL: set ANGLEHR_*_POSTGRES_DSN and DB_URL_GLOBAL with sslmode=require
# Cloudflare R2: set R2_ACCESS_KEY, R2_SECRET_KEY, and R2_ENDPOINT.
#
apiVersion: v1
kind: Secret
metadata:
  name: anglehr-secrets
  namespace: anglehr
type: Opaque
stringData:
  DB_URL_GLOBAL: postgres://anglehr:REPLACE@global-db.example.com:5432/anglehr_global?sslmode=require
  R2_ACCESS_KEY: REPLACE
  R2_SECRET_KEY: REPLACE
  R2_ENDPOINT: https://YOUR_ACCOUNT_ID.r2.cloudflarestorage.com
  ANGLEHR_UK_POSTGRES_DSN: postgres://anglehr:REPLACE@uk-db.example.com:5432/anglehr_uk?sslmode=require
  ANGLEHR_UK_R2_BUCKET: anglehr-uk
  ANGLEHR_US_POSTGRES_DSN: postgres://anglehr:REPLACE@us-db.example.com:5432/anglehr_us?sslmode=require
  ANGLEHR_US_R2_BUCKET: anglehr-us
  ANGLEHR_AFRICA_POSTGRES_DSN: postgres://anglehr:REPLACE@africa-db.example.com:5432/anglehr_africa?sslmode=require
  ANGLEHR_AFRICA_R2_BUCKET: anglehr-africa
  ANGLEHR_EU_POSTGRES_DSN: postgres://anglehr:REPLACE@eu-db.example.com:5432/anglehr_eu?sslmode=require
  ANGLEHR_EU_R2_ENDPOINT: https://YOUR_ACCOUNT_ID.eu.r2.cloudflarestorage.com
  ANGLEHR_EU_R2_BUCKET: anglehr-eu
  SMTP_HOST: smtp.example.com
  SMTP_PORT: "587"
  SMTP_USER: no-reply@example.com
  SMTP_PASSWORD: REPLACE
  SMTP_FROM: Angle HR <no-reply@anglehr.com>
  APP_URL: https://app.example.com
