# Production secret template — replace placeholder values with managed service credentials.
# Do NOT commit real secrets. Prefer External Secrets Operator or your cloud secret store.
#
# Managed PostgreSQL: set DB_URL_* and ANGLEHR_*_POSTGRES_DSN with sslmode=require
# S3-compatible storage: set ANGLEHR_*_MINIO_ENDPOINT to s3.<region>.amazonaws.com
#   and ANGLEHR_*_MINIO_USE_SSL=true (add as secret keys or ConfigMap if using static values)
#
apiVersion: v1
kind: Secret
metadata:
  name: anglehr-secrets
  namespace: anglehr
type: Opaque
stringData:
  DB_URL_GLOBAL: postgres://anglehr:REPLACE@global-db.example.com:5432/anglehr_global?sslmode=require
  ANGLEHR_UK_POSTGRES_DSN: postgres://anglehr:REPLACE@uk-db.example.com:5432/anglehr_uk?sslmode=require
  ANGLEHR_UK_MINIO_ENDPOINT: s3.eu-west-2.amazonaws.com
  ANGLEHR_UK_MINIO_USE_SSL: "true"
  ANGLEHR_UK_MINIO_ACCESS_KEY: REPLACE
  ANGLEHR_UK_MINIO_SECRET_KEY: REPLACE
  ANGLEHR_UK_MINIO_BUCKET: anglehr-uk
  ANGLEHR_US_POSTGRES_DSN: postgres://anglehr:REPLACE@us-db.example.com:5432/anglehr_us?sslmode=require
  ANGLEHR_US_MINIO_ENDPOINT: s3.us-east-1.amazonaws.com
  ANGLEHR_US_MINIO_USE_SSL: "true"
  ANGLEHR_US_MINIO_ACCESS_KEY: REPLACE
  ANGLEHR_US_MINIO_SECRET_KEY: REPLACE
  ANGLEHR_US_MINIO_BUCKET: anglehr-us
  ANGLEHR_AFRICA_POSTGRES_DSN: postgres://anglehr:REPLACE@africa-db.example.com:5432/anglehr_africa?sslmode=require
  ANGLEHR_AFRICA_MINIO_ENDPOINT: s3.af-south-1.amazonaws.com
  ANGLEHR_AFRICA_MINIO_USE_SSL: "true"
  ANGLEHR_AFRICA_MINIO_ACCESS_KEY: REPLACE
  ANGLEHR_AFRICA_MINIO_SECRET_KEY: REPLACE
  ANGLEHR_AFRICA_MINIO_BUCKET: anglehr-africa
  ANGLEHR_EU_POSTGRES_DSN: postgres://anglehr:REPLACE@eu-db.example.com:5432/anglehr_eu?sslmode=require
  ANGLEHR_EU_MINIO_ENDPOINT: s3.eu-west-1.amazonaws.com
  ANGLEHR_EU_MINIO_USE_SSL: "true"
  ANGLEHR_EU_MINIO_ACCESS_KEY: REPLACE
  ANGLEHR_EU_MINIO_SECRET_KEY: REPLACE
  ANGLEHR_EU_MINIO_BUCKET: anglehr-eu
  SMTP_HOST: smtp.example.com
  SMTP_PORT: "587"
  SMTP_USER: no-reply@example.com
  SMTP_PASSWORD: REPLACE
  SMTP_FROM: Angle HR <no-reply@anglehr.com>
  APP_URL: https://app.example.com
