name: openhr-local

services:
  # ========== PostgreSQL (one instance, six databases) ==========
  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: openhr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: openhr_global
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - anglehr_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openhr -d openhr_global"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========== Shared ==========
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - anglehr_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    # minio/minio and quay.io/minio images were withdrawn from public registries; Chainguard still publishes a free build.
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio_data:/data
    networks:
      - anglehr_net
    healthcheck:
      # no curl/wget in the image; probe with bash /dev/tcp
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /minio/health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; read -r l <&3; [[ $$l == *200* ]]"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-setup:
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/openhr-uk
        mc mb --ignore-existing local/openhr-us
        mc mb --ignore-existing local/openhr-africa
        mc mb --ignore-existing local/openhr-eu
        mc mb --ignore-existing local/openhr-asia
    networks:
      - anglehr_net
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    environment:
      ANGLEHR_UK_POSTGRES_DSN: postgres://openhr:${POSTGRES_PASSWORD:-change-me}@postgres:5432/openhr_uk?sslmode=disable
      ANGLEHR_US_POSTGRES_DSN: postgres://openhr:${POSTGRES_PASSWORD:-change-me}@postgres:5432/openhr_us?sslmode=disable
      ANGLEHR_AFRICA_POSTGRES_DSN: postgres://openhr:${POSTGRES_PASSWORD:-change-me}@postgres:5432/openhr_africa?sslmode=disable
      ANGLEHR_EU_POSTGRES_DSN: postgres://openhr:${POSTGRES_PASSWORD:-change-me}@postgres:5432/openhr_eu?sslmode=disable
      ANGLEHR_ASIA_POSTGRES_DSN: postgres://openhr:${POSTGRES_PASSWORD:-change-me}@postgres:5432/openhr_asia?sslmode=disable
      DB_URL_GLOBAL: postgres://openhr:${POSTGRES_PASSWORD:-change-me}@postgres:5432/openhr_global?sslmode=disable
      FORCE_MIGRATE: "1"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - anglehr_net
    restart: "no"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    platform: linux/amd64
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    networks:
      - anglehr_net
    restart: unless-stopped

networks:
  anglehr_net:
    name: ${LOCAL_NETWORK:-anglehr_net}

volumes:
  postgres_data:
  minio_data:
