services:
  # ========== United Kingdom (uk) ==========
  postgres_uk:
    image: postgres:16-alpine
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: anglehr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_UK}
      POSTGRES_DB: anglehr_uk
    volumes:
      - postgres_uk_data:/var/lib/postgresql/data
    networks:
      - anglehr_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anglehr -d anglehr_uk"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========== United States (us) ==========
  postgres_us:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: anglehr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_US}
      POSTGRES_DB: anglehr_us
    volumes:
      - postgres_us_data:/var/lib/postgresql/data
    networks:
      - anglehr_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anglehr -d anglehr_us"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========== Africa (africa) ==========
  postgres_africa:
    image: postgres:16-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: anglehr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_AFRICA}
      POSTGRES_DB: anglehr_africa
    volumes:
      - postgres_africa_data:/var/lib/postgresql/data
    networks:
      - anglehr_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anglehr -d anglehr_africa"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========== European Union (eu) ==========
  postgres_eu:
    image: postgres:16-alpine
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: anglehr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_EU}
      POSTGRES_DB: anglehr_eu
    volumes:
      - postgres_eu_data:/var/lib/postgresql/data
    networks:
      - anglehr_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anglehr -d anglehr_eu"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========== Global registry (routing metadata) ==========
  postgres_global:
    image: postgres:16-alpine
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: anglehr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_GLOBAL}
      POSTGRES_DB: anglehr_global
    volumes:
      - postgres_global_data:/var/lib/postgresql/data
    networks:
      - anglehr_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anglehr -d anglehr_global"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========== Shared ==========
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - anglehr_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    image: postgres:16-alpine
    volumes:
      - ./db/migrations:/migrations:ro
    entrypoint: ["/bin/bash", "/migrations/migrate-all.sh", "up"]
    environment:
      ANGLEHR_UK_POSTGRES_DSN: postgres://anglehr:${POSTGRES_PASSWORD_UK}@postgres_uk:5432/anglehr_uk?sslmode=disable
      ANGLEHR_US_POSTGRES_DSN: postgres://anglehr:${POSTGRES_PASSWORD_US}@postgres_us:5432/anglehr_us?sslmode=disable
      ANGLEHR_AFRICA_POSTGRES_DSN: postgres://anglehr:${POSTGRES_PASSWORD_AFRICA}@postgres_africa:5432/anglehr_africa?sslmode=disable
      ANGLEHR_EU_POSTGRES_DSN: postgres://anglehr:${POSTGRES_PASSWORD_EU}@postgres_eu:5432/anglehr_eu?sslmode=disable
      DB_URL_GLOBAL: postgres://anglehr:${POSTGRES_PASSWORD_GLOBAL}@postgres_global:5432/anglehr_global?sslmode=disable
    depends_on:
      postgres_uk:
        condition: service_healthy
      postgres_us:
        condition: service_healthy
      postgres_africa:
        condition: service_healthy
      postgres_eu:
        condition: service_healthy
      postgres_global:
        condition: service_healthy
    networks:
      - anglehr_net
    restart: "no"

  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SERVER_PORT: "8080"
      APP_ENV: ${APP_ENV:-development}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
      FLUVIO_UI_ORIGIN: ${FLUVIO_UI_ORIGIN:-http://localhost:5173}
      REDIS_URL: redis://redis:6379/${REDIS_DB:-0}
      DB_URL_GLOBAL: postgres://anglehr:${POSTGRES_PASSWORD_GLOBAL}@postgres_global:5432/anglehr_global?sslmode=disable
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      R2_ENDPOINT: ${R2_ENDPOINT}
      ANGLEHR_UK_POSTGRES_DSN: postgres://anglehr:${POSTGRES_PASSWORD_UK}@postgres_uk:5432/anglehr_uk?sslmode=disable
      ANGLEHR_UK_R2_BUCKET: ${ANGLEHR_UK_R2_BUCKET}
      ANGLEHR_US_POSTGRES_DSN: postgres://anglehr:${POSTGRES_PASSWORD_US}@postgres_us:5432/anglehr_us?sslmode=disable
      ANGLEHR_US_R2_BUCKET: ${ANGLEHR_US_R2_BUCKET}
      ANGLEHR_AFRICA_POSTGRES_DSN: postgres://anglehr:${POSTGRES_PASSWORD_AFRICA}@postgres_africa:5432/anglehr_africa?sslmode=disable
      ANGLEHR_AFRICA_R2_BUCKET: ${ANGLEHR_AFRICA_R2_BUCKET}
      ANGLEHR_EU_POSTGRES_DSN: postgres://anglehr:${POSTGRES_PASSWORD_EU}@postgres_eu:5432/anglehr_eu?sslmode=disable
      ANGLEHR_EU_R2_BUCKET: ${ANGLEHR_EU_R2_BUCKET}
    depends_on:
      postgres_uk:
        condition: service_healthy
      postgres_us:
        condition: service_healthy
      postgres_africa:
        condition: service_healthy
      postgres_eu:
        condition: service_healthy
      postgres_global:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - anglehr_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/v1/countries || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    environment:
      APP_ENV: ${APP_ENV:-development}
      REDIS_URL: redis://redis:6379/${REDIS_DB:-0}
      DB_URL_GLOBAL: postgres://anglehr:${POSTGRES_PASSWORD_GLOBAL}@postgres_global:5432/anglehr_global?sslmode=disable
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      APP_URL: ${APP_URL}
    depends_on:
      postgres_global:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - anglehr_net
    restart: unless-stopped

  fluvio-ui:
    image: ghcr.io/software78/fluvio_ui:latest
    build:
      context: https://github.com/software78/fluvio_ui.git#main
      args:
        # Baked into the Vite bundle at build time (not read at container runtime).
        VITE_API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:8080}
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "5173:80"
    networks:
      - anglehr_net

networks:
  anglehr_net:
    name: anglehr_net

volumes:
  postgres_uk_data:
  postgres_us_data:
  postgres_africa_data:
  postgres_eu_data:
  postgres_global_data:
