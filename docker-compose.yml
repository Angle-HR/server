services:
  # ========== PostgreSQL (one instance, six databases) ==========
  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: anglehr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: anglehr_global
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    networks:
      - anglehr_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anglehr -d anglehr_global"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========== Shared ==========
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - anglehr_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - anglehr_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/anglehr-uk
        mc mb --ignore-existing local/anglehr-us
        mc mb --ignore-existing local/anglehr-africa
        mc mb --ignore-existing local/anglehr-eu
        mc mb --ignore-existing local/anglehr-asia
    networks:
      - anglehr_net
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    environment:
      ANGLEHR_UK_POSTGRES_DSN: postgres://anglehr:${POSTGRES_PASSWORD:-change-me}@postgres:5432/anglehr_uk?sslmode=disable
      ANGLEHR_US_POSTGRES_DSN: postgres://anglehr:${POSTGRES_PASSWORD:-change-me}@postgres:5432/anglehr_us?sslmode=disable
      ANGLEHR_AFRICA_POSTGRES_DSN: postgres://anglehr:${POSTGRES_PASSWORD:-change-me}@postgres:5432/anglehr_africa?sslmode=disable
      ANGLEHR_EU_POSTGRES_DSN: postgres://anglehr:${POSTGRES_PASSWORD:-change-me}@postgres:5432/anglehr_eu?sslmode=disable
      ANGLEHR_ASIA_POSTGRES_DSN: postgres://anglehr:${POSTGRES_PASSWORD:-change-me}@postgres:5432/anglehr_asia?sslmode=disable
      DB_URL_GLOBAL: postgres://anglehr:${POSTGRES_PASSWORD:-change-me}@postgres:5432/anglehr_global?sslmode=disable
      FORCE_MIGRATE: "1"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - anglehr_net
    restart: "no"

  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SERVER_PORT: "8080"
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8081}
      FLUVIO_UI_ORIGIN: ${FLUVIO_UI_ORIGIN:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-jwt-secret-change-me}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-3600}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-604800}
      AUTH_DEFAULT_REGION: ${AUTH_DEFAULT_REGION:-uk}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@anglehr.local}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-changeme123}
      ADMIN_BOOTSTRAP_NAME: ${ADMIN_BOOTSTRAP_NAME:-Bootstrap Admin}
      REDIS_URL: redis://redis:6379/${REDIS_DB:-0}
      DB_URL_GLOBAL: postgres://anglehr:${POSTGRES_PASSWORD:-change-me}@postgres:5432/anglehr_global?sslmode=disable
      R2_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      R2_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      R2_ENDPOINT: http://minio:9000
      ANGLEHR_UK_POSTGRES_DSN: postgres://anglehr:${POSTGRES_PASSWORD:-change-me}@postgres:5432/anglehr_uk?sslmode=disable
      ANGLEHR_UK_R2_BUCKET: ${ANGLEHR_UK_R2_BUCKET:-anglehr-uk}
      ANGLEHR_US_POSTGRES_DSN: postgres://anglehr:${POSTGRES_PASSWORD:-change-me}@postgres:5432/anglehr_us?sslmode=disable
      ANGLEHR_US_R2_BUCKET: ${ANGLEHR_US_R2_BUCKET:-anglehr-us}
      ANGLEHR_AFRICA_POSTGRES_DSN: postgres://anglehr:${POSTGRES_PASSWORD:-change-me}@postgres:5432/anglehr_africa?sslmode=disable
      ANGLEHR_AFRICA_R2_BUCKET: ${ANGLEHR_AFRICA_R2_BUCKET:-anglehr-africa}
      ANGLEHR_EU_POSTGRES_DSN: postgres://anglehr:${POSTGRES_PASSWORD:-change-me}@postgres:5432/anglehr_eu?sslmode=disable
      ANGLEHR_EU_R2_BUCKET: ${ANGLEHR_EU_R2_BUCKET:-anglehr-eu}
      ANGLEHR_ASIA_POSTGRES_DSN: postgres://anglehr:${POSTGRES_PASSWORD:-change-me}@postgres:5432/anglehr_asia?sslmode=disable
      ANGLEHR_ASIA_R2_BUCKET: ${ANGLEHR_ASIA_R2_BUCKET:-anglehr-asia}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-setup:
        condition: service_completed_successfully
    networks:
      - anglehr_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/v1/countries || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:v1.0.1
    platform: linux/amd64
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    networks:
      - anglehr_net
    restart: unless-stopped

  email-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: email-worker
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      REDIS_URL: redis://redis:6379/${REDIS_DB:-0}
      DB_URL_GLOBAL: postgres://anglehr:${POSTGRES_PASSWORD:-change-me}@postgres:5432/anglehr_global?sslmode=disable
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@anglehr.local}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Angle HR}
      APP_URL: ${APP_URL:-http://localhost:8080}
      ADMIN_APP_URL: ${ADMIN_APP_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mailhog:
        condition: service_started
    networks:
      - anglehr_net
    restart: unless-stopped

  fluvio-ui:
    image: ghcr.io/software78/fluvio_ui:1.0.1
    environment:
      VITE_API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:8080}
      VITE_API_BASIC_AUTH_USER: ${VITE_API_BASIC_AUTH_USER:-}
      VITE_API_BASIC_AUTH_PASSWORD: ${VITE_API_BASIC_AUTH_PASSWORD:-}
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${FLUVIO_UI_PORT:-5173}:80"
    networks:
      - anglehr_net

networks:
  anglehr_net:
    name: anglehr_net

volumes:
  postgres_data:
  minio_data:
