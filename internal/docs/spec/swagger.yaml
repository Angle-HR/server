basePath: /api/v1
definitions:
  apidoc.ErrorBody:
    properties:
      code:
        example: VALIDATION_ERROR
        type: string
      details:
        additionalProperties: {}
        type: object
      message:
        example: invalid request body
        type: string
    type: object
  apidoc.ErrorEnvelope:
    properties:
      error:
        $ref: '#/definitions/apidoc.ErrorBody'
      meta:
        $ref: '#/definitions/apidoc.Meta'
    type: object
  apidoc.Meta:
    properties:
      has_more:
        type: boolean
      next_cursor:
        type: string
      request_id:
        example: abc123
        type: string
    type: object
  handler.CountriesEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/handler.CountryResponse'
        type: array
      meta:
        $ref: '#/definitions/apidoc.Meta'
    type: object
  handler.CountryResponse:
    properties:
      icon_key:
        example: flag-uk
        type: string
      id:
        example: a1b2c3d4-e5f6-4789-a012-3456789abcde
        type: string
      name:
        example: United Kingdom
        type: string
      region:
        enum:
        - uk
        - us
        - africa
        - eu
        example: uk
        type: string
      slug:
        example: united-kingdom
        type: string
    type: object
  handler.SignupData:
    properties:
      message:
        example: You're on the list!
        type: string
      region:
        example: uk
        type: string
    type: object
  handler.SignupEnvelope:
    properties:
      data:
        $ref: '#/definitions/handler.SignupData'
      meta:
        $ref: '#/definitions/apidoc.Meta'
    type: object
  handler.SignupRequest:
    properties:
      country_id:
        example: a1b2c3d4-e5f6-4789-a012-3456789abcde
        type: string
      email:
        example: jerry@example.com
        type: string
      full_name:
        example: Jerry
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Waitlist signup API for Open HR.
  title: Angle HR Waitlist API
  version: "1.0"
paths:
  /countries:
    get:
      description: Returns active countries for the waitlist region dropdown.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.CountriesEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apidoc.ErrorEnvelope'
      summary: List countries
      tags:
      - countries
  /waitlist:
    post:
      consumes:
      - application/json
      description: Registers a user for the regional waitlist and global users registry.
      parameters:
      - description: Signup payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.SignupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.SignupEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apidoc.ErrorEnvelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/apidoc.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apidoc.ErrorEnvelope'
      summary: Join waitlist
      tags:
      - waitlist
swagger: "2.0"
