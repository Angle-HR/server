    /jobs/audit:
        get:
            description: 'The company''s audit events, newest first: job changes written by hiring (source hiring) and application events written by the applications service (source applications: received, viewed, file_downloaded, status_changed). Needs the job.audit.view permission. Rows carry ids and the stored diff only, never candidate data. Page with next_cursor.'
            parameters:
                - description: Only this job (the entity)
                  in: query
                  name: job_id
                  type: string
                - description: Only events by this user id
                  in: query
                  name: actor_id
                  type: string
                - description: Exact action, e.g. job.published
                  in: query
                  name: action
                  type: string
                - description: On or after this time (RFC 3339 or YYYY-MM-DD)
                  in: query
                  name: from
                  type: string
                - description: Before this time (RFC 3339), or up to the end of this day (YYYY-MM-DD)
                  in: query
                  name: to
                  type: string
                - description: next_cursor from the previous page
                  in: query
                  name: cursor
                  type: string
                - description: Page size (default 50, max 100)
                  in: query
                  name: limit
                  type: integer
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/internal_hiring_hiringhttp.AuditListEnvelope'
                "400":
                    description: Bad Request
                    schema:
                        $ref: '#/definitions/github_com_Angle-HR_server_internal_apidoc.ErrorEnvelope'
                "403":
                    description: Forbidden
                    schema:
                        $ref: '#/definitions/github_com_Angle-HR_server_internal_apidoc.ErrorEnvelope'
            security:
                - SessionCookie: []
            summary: Job audit trail
            tags:
                - jobs
    /jobs/bulk:
        post:
            consumes:
                - application/json
            description: 'Pause, resume, close, reopen, archive or move to draft, for up to 100 jobs. Resume and reopen run the publish checks for each job; a job that fails them is skipped with the reasons. Not all-or-nothing: each job is changed on its own, and the ones that could not be are listed with the reason. The result carries each job''s earlier status so the client can offer undo.'
            parameters:
                - description: Action and job ids
                  in: body
                  name: body
                  required: true
                  schema:
                    $ref: '#/definitions/internal_hiring_hiringhttp.BulkRequest'
            produces:
