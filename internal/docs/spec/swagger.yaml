                  in: query
                  name: created_by
                  type: string
                - description: Only jobs this user id is on the hiring team of
                  in: query
                  name: assignee
                  type: string
                - description: full_time, part_time, contract or internship
                  in: query
                  name: employment_type
                  type: string
                - description: onsite, hybrid or remote
                  in: query
                  name: workplace_type
                  type: string
                - description: anywhere, specific_area or specific_timezone
                  in: query
                  name: location_mode
                  type: string
                - description: Two-letter market code, e.g. UK
                  in: query
                  name: market
                  type: string
                - description: Created on or after this date (YYYY-MM-DD)
                  in: query
                  name: created_from
                  type: string
                - description: Created on or before this date (YYYY-MM-DD)
                  in: query
                  name: created_to
                  type: string
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
