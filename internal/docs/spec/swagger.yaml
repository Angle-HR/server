host: localhost:8081
info:
    contact: {}
    description: |-
        Product API for OpenHR: accounts, onboarding, hiring and applications.
        Interactive docs (Scalar) are served at `/` in non-production environments.
        Product flow: signup → verify email (6-digit OTP, 5 min expiry) → profile → address → [business] → complete.
        Authentication is a server-side session in an HttpOnly cookie (`__Host-openhr_session`, or `openhr_session` when COOKIE_SECURE=false); there are no bearer tokens.
        Login, verify-email, login/otp/verify, login/totp and accept-invite return `csrf_token` in the body; `GET /auth/me` returns it again on page load. Every POST/PUT/PATCH/DELETE on an authenticated route must send it as `X-CSRF-Token` (403 `CSRF_INVALID` otherwise). Browsers must call with credentials included.
        Admin ops console APIs live under `/api/v1/admin` and use a separate cookie (`__Host-openhr_admin_session`) and CSRF token.
    title: OpenHR API
    version: "1.0"
paths:
    /admin/audit-logs:
        get:
            description: Newest first. Filter by actor, action, entity (resource_type and resource_id) and time. The ip is returned as stored. Page with limit and offset; meta.has_more says whether another page follows. Needs audit:read.
            parameters:
                - description: Actor UUID
                  in: query
                  name: actor_id
                  type: string
                - description: Action filter
                  in: query
                  name: action
                  type: string
                - description: Resource type
                  in: query
                  name: resource_type
                  type: string
                - description: Resource id (with resource_type)
                  in: query
                  name: resource_id
                  type: string
                - description: On or after this time (RFC 3339 or YYYY-MM-DD)
                  in: query
                  name: from
                  type: string
                - description: Before this time (RFC 3339), or up to the end of this day (YYYY-MM-DD)
                  in: query
                  name: to
                  type: string
                - description: Page size (default 50, max 100)
                  in: query
                  name: limit
                  type: integer
                - description: Offset
                  in: query
                  name: offset
                  type: integer
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/internal_identityhttp.AdminAuditListEnvelope'
                "400":
                    description: Bad Request
                    schema:
                        $ref: '#/definitions/github_com_Angle-HR_server_internal_apidoc.ErrorEnvelope'
            security:
                - AdminSessionCookie: []
            summary: List admin audit logs
            tags:
                - admin/audit
    /admin/auth/accept-invite:
        post:
            consumes:
                - application/json
            description: Sets name and password for an invited admin and starts an admin cookie session.
            parameters:
                - description: Accept payload
                  in: body
                  name: body
                  required: true
                  schema:
                    $ref: '#/definitions/internal_identityhttp.AdminAcceptInviteRequest'
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/internal_identityhttp.AdminTokenEnvelope'
                "400":
                    description: Bad Request
                    schema:
                        $ref: '#/definitions/github_com_Angle-HR_server_internal_apidoc.ErrorEnvelope'
                "404":
                    description: Not Found
                    schema:
                        $ref: '#/definitions/github_com_Angle-HR_server_internal_apidoc.ErrorEnvelope'
                "410":
                    description: Gone
                    schema:
                        $ref: '#/definitions/github_com_Angle-HR_server_internal_apidoc.ErrorEnvelope'
            summary: Accept admin invite
            tags:
                - admin/auth
    /admin/auth/invite/{token}:
        get:
            description: Validates an invite token and returns the invited email and expiry.
            parameters:
                - description: Invite token
                  in: path
                  name: token
                  required: true
                  type: string
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/internal_identityhttp.AdminInvitePreviewEnvelope'
                "404":
                    description: Not Found
                    schema:
                        $ref: '#/definitions/github_com_Angle-HR_server_internal_apidoc.ErrorEnvelope'
                "410":
                    description: Gone
                    schema:
                        $ref: '#/definitions/github_com_Angle-HR_server_internal_apidoc.ErrorEnvelope'
            summary: Preview admin invite
            tags:
                - admin/auth
    /admin/auth/login:
        post:
            consumes:
                - application/json
            description: 'Authenticates an admin user and starts an admin cookie session (separate from the product session) and returns the CSRF token. An admin with TOTP enabled gets no session: the response is {totp_required:true, expires_in:300} plus the single-use admin pre-auth cookie, and POST /admin/auth/login/totp completes the login. When ADMIN_TOTP_REQUIRED is on and the admin has not enrolled, the session is issued with totp_enrollment_required:true and every route except /admin/auth/{me,totp/enroll,totp/confirm} answers 403 TOTP_ENROLLMENT_REQUIRED until they enrol.'
            parameters:
                - description: Login payload
                  in: body
                  name: body
                  required: true
                  schema:
                    $ref: '#/definitions/internal_identityhttp.AdminLoginRequest'
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/internal_identityhttp.AdminTokenEnvelope'
                "400":
                    description: Bad Request
                    schema:
                        $ref: '#/definitions/github_com_Angle-HR_server_internal_apidoc.ErrorEnvelope'
                "401":
                    description: Unauthorized
                    schema:
                        $ref: '#/definitions/github_com_Angle-HR_server_internal_apidoc.ErrorEnvelope'
                "500":
                    description: Internal Server Error
                    schema:
                        $ref: '#/definitions/github_com_Angle-HR_server_internal_apidoc.ErrorEnvelope'
            summary: Admin login
            tags:
                - admin/auth
    /admin/auth/login/totp:
        post:
            consumes:
                - application/json
            description: Completes login for an admin who has TOTP enabled. Requires the single-use admin pre-auth cookie set by POST /admin/auth/login (valid 5 minutes, separate from the product pre-auth) plus a valid authenticator code, then starts the admin session (MFA satisfied) and returns the CSRF token. A wrong code keeps the pre-auth alive; five wrong codes in five minutes lock the admin's TOTP checks for fifteen (429 too_many_attempts).
            parameters:
                - description: Code
                  in: body
                  name: body
                  required: true
                  schema:
                    $ref: '#/definitions/internal_identityhttp.AuthLoginTOTPRequest'
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/internal_identityhttp.AdminTokenEnvelope'
                "400":
                    description: Bad Request
                    schema:
                        $ref: '#/definitions/github_com_Angle-HR_server_internal_apidoc.ErrorEnvelope'
                "401":
                    description: Unauthorized
                    schema:
                        $ref: '#/definitions/github_com_Angle-HR_server_internal_apidoc.ErrorEnvelope'
                "429":
                    description: Too Many Requests
                    schema:
                        $ref: '#/definitions/github_com_Angle-HR_server_internal_apidoc.ErrorEnvelope'
            summary: Complete admin login with TOTP
            tags:
                - admin/auth
    /admin/auth/logout:
        post:
            description: Revokes the admin session and clears the admin cookies. Idempotent.
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/internal_identityhttp.AuthMessageEnvelope'
            summary: Admin logout
            tags:
                - admin/auth
    /admin/auth/me:
        get:
            description: Returns the authenticated admin profile, roles, and permissions.
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/internal_identityhttp.AdminMeEnvelope'
                "401":
                    description: Unauthorized
                    schema:
                        $ref: '#/definitions/github_com_Angle-HR_server_internal_apidoc.ErrorEnvelope'
            security:
                - AdminSessionCookie: []
            summary: Admin profile
            tags:
                - admin/auth
    /admin/auth/refresh:
        post:
            description: 'Removed: admin sessions are server-side with a sliding idle timeout. Always returns 410 SESSION_REFRESH_REMOVED.'
            produces:
                - application/json
            responses:
                "410":
                    description: Gone
                    schema:
                        $ref: '#/definitions/github_com_Angle-HR_server_internal_apidoc.ErrorEnvelope'
            summary: Admin token refresh (removed)
            tags:
                - admin/auth
    /admin/auth/totp/confirm:
        post:
            consumes:
                - application/json
            description: Validates a code from the authenticator app and enables TOTP. Every other session of the admin is revoked and the caller gets a fresh session (MFA satisfied) with a new CSRF token in the body.
            parameters:
                - description: Code
                  in: body
                  name: body
                  required: true
                  schema:
                    $ref: '#/definitions/internal_identityhttp.AuthTOTPConfirmRequest'
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/internal_identityhttp.AdminTokenEnvelope'
                "400":
                    description: Bad Request
                    schema:
                        $ref: '#/definitions/github_com_Angle-HR_server_internal_apidoc.ErrorEnvelope'
                "401":
                    description: Unauthorized
                    schema:
                        $ref: '#/definitions/github_com_Angle-HR_server_internal_apidoc.ErrorEnvelope'
                "429":
                    description: Too Many Requests
                    schema:
                        $ref: '#/definitions/github_com_Angle-HR_server_internal_apidoc.ErrorEnvelope'
            security:
                - AdminSessionCookie: []
            summary: Confirm admin TOTP enrolment
            tags:
                - admin/auth
    /admin/auth/totp/disable:
        post:
            consumes:
                - application/json
            description: 'Disables TOTP for the signed-in admin after checking the password and a current authenticator code, and signs the admin out everywhere. Refused (403) while ADMIN_TOTP_REQUIRED is on: a superadmin can reset another admin instead.'
            parameters:
                - description: Password and code
                  in: body
                  name: body
                  required: true
                  schema:
                    $ref: '#/definitions/internal_identityhttp.AuthTOTPDisableRequest'
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/internal_identityhttp.AuthMessageEnvelope'
                "400":
                    description: Bad Request
                    schema:
                        $ref: '#/definitions/github_com_Angle-HR_server_internal_apidoc.ErrorEnvelope'
                "401":
                    description: Unauthorized
                    schema:
                        $ref: '#/definitions/github_com_Angle-HR_server_internal_apidoc.ErrorEnvelope'
                "403":
                    description: Forbidden
                    schema:
                        $ref: '#/definitions/github_com_Angle-HR_server_internal_apidoc.ErrorEnvelope'
            security:
                - AdminSessionCookie: []
            summary: Disable own admin TOTP
            tags:
                - admin/auth
    /admin/auth/totp/enroll:
        post:
            description: Generates a new authenticator secret and otpauth URL for the signed-in admin (stored encrypted, not active until confirmed). Allowed for a session that still has to enrol when ADMIN_TOTP_REQUIRED is on. 409 when TOTP is already enabled.
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/internal_identityhttp.AuthTOTPEnrollEnvelope'
                "401":
                    description: Unauthorized
                    schema:
                        $ref: '#/definitions/github_com_Angle-HR_server_internal_apidoc.ErrorEnvelope'
                "409":
                    description: Conflict
                    schema:
                        $ref: '#/definitions/github_com_Angle-HR_server_internal_apidoc.ErrorEnvelope'
            security:
                - AdminSessionCookie: []
            summary: Start admin TOTP enrolment
            tags:
                - admin/auth
    /admin/catalogs/{type}:
        get:
            parameters:
                - description: Catalog type
                  in: path
                  name: type
                  required: true
                  type: string
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/internal_handler.AdminCatalogListEnvelope'
            security:
                - AdminSessionCookie: []
            summary: List catalog entries
            tags:
                - admin/catalogs
        post:
            consumes:
