                  in: query
                  name: action
                  type: string
                - description: Resource type
                  in: query
                  name: resource_type
                  type: string
                - description: Page size
                  in: query
                  name: limit
                  type: integer
                - description: Offset
                  in: query
                  name: offset
                  type: integer
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/internal_handler.AdminAuditListEnvelope'
            security:
                - BearerAuth: []
            summary: List admin audit logs
            tags:
