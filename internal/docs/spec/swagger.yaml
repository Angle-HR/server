host: localhost:8080
info:
    contact: {}
    description: |-
        Waitlist and product onboarding API for Open HR.
        Interactive docs (Scalar) are served at `/` in non-production environments.
        Product flow: signup → verify email (6-digit OTP, 5 min expiry) → profile → address → [business] → complete.
        Onboarding step endpoints require `Authorization: Bearer <access_token>` after email verification.
        Admin ops console APIs live under `/api/v1/admin` and require a separate admin JWT (`token_use=admin`).
    title: Angle HR API
    version: "1.0"
paths:
    /admin/audit-logs:
        get:
            parameters:
                - description: Actor UUID
                  in: query
                  name: actor_id
