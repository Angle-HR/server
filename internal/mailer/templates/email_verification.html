<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Verify your email</title>
</head>
<body style="margin: 0; padding: 40px 20px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f9fafb; color: #111827;">
    <div style="max-width: 580px; margin: 0 auto; background-color: #ffffff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 40px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);">
        <div style="margin-bottom: 32px; text-align: left;">
            <span style="font-size: 20px; font-weight: 700; color: #0284c7; letter-spacing: -0.025em;">Angle HR</span>
        </div>

        <h1 style="font-size: 24px; font-weight: 700; line-height: 32px; color: #0f172a; margin-top: 0; margin-bottom: 16px; letter-spacing: -0.025em;">Verify your email</h1>

        <p style="font-size: 16px; line-height: 24px; color: #475569; margin-top: 0; margin-bottom: 24px;">Enter this verification code to confirm your email address and continue setting up your account:</p>

        <div style="text-align: center; margin: 32px 0;">
            <span style="display: inline-block; font-size: 32px; font-weight: 700; letter-spacing: 8px; color: #0f172a; background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px 32px;">{{.Code}}</span>
        </div>

        <p style="font-size: 16px; line-height: 24px; color: #475569; margin-top: 0; margin-bottom: 32px;">This code expires in {{.ExpiresInSeconds}} seconds. If you did not request this, you can safely ignore this email.</p>

        <div style="border-top: 1px solid #f1f5f9; padding-top: 24px; margin-top: 32px;">
            <p style="font-size: 14px; line-height: 20px; color: #94a3b8; margin: 0;">Best regards,<br>The Angle HR Team</p>
        </div>
    </div>
</body>
</html>
