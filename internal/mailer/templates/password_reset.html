<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Reset your password</title>
</head>
<body style="margin: 0; padding: 40px 20px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f9fafb; color: #111827;">
    <div style="max-width: 580px; margin: 0 auto; background-color: #ffffff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 40px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);">
        <div style="margin-bottom: 32px; text-align: left;">
            <span style="font-size: 20px; font-weight: 700; color: #0284c7; letter-spacing: -0.025em;">Angle HR</span>
        </div>

        <h1 style="font-size: 24px; font-weight: 700; line-height: 32px; color: #0f172a; margin-top: 0; margin-bottom: 16px; letter-spacing: -0.025em;">Reset your password</h1>

        <p style="font-size: 16px; line-height: 24px; color: #475569; margin-top: 0; margin-bottom: 24px;">
            We received a request to reset your Open HR password. Click the button below to choose a new one.
        </p>

        <div style="text-align: left; margin-bottom: 32px;">
            <a href="{{.AppURL}}/reset-password?token={{.Token}}"
                style="display: inline-block; background-color: #0284c7; color: #ffffff; padding: 12px 24px; font-size: 15px; font-weight: 600; text-decoration: none; border-radius: 8px;">
                Reset password
            </a>
        </div>

        <p style="font-size: 14px; line-height: 20px; color: #94a3b8; margin-top: 0; margin-bottom: 0;">
            This link expires in {{.ExpiresInSeconds}} seconds. If you did not request a reset, you can ignore this email.
        </p>
    </div>
</body>
</html>
