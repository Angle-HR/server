syntax = "proto3";

package openhr.hiring.v1;

import "google/protobuf/timestamp.proto";

// HiringService owns job postings, drafts, templates, lifecycle (publish, pause,
// close, expire), compliance gates, DPIA records and the share kit, plus the global
// hiring.job_registry (public id -> region, company).
// Company, user, region and permissions arrive as CallContext metadata (pkg/rpc).
service HiringService {
  rpc CreateDraft(CreateDraftRequest) returns (CreateDraftResponse);
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  // PublishJob evaluates the publish gates (calling org.GetPublishReadiness for the
  // authoritative KYB/agreement state), freezes the form version, registers the job
  // in the global registry and emits hiring.job.published. A blocked publish returns
  // OK with published=false and the blocking gates, not an error.
  rpc PublishJob(PublishJobRequest) returns (PublishJobResponse);
  rpc PauseJob(PauseJobRequest) returns (PauseJobResponse);
  rpc ResumeJob(ResumeJobRequest) returns (ResumeJobResponse);
  rpc CloseJob(CloseJobRequest) returns (CloseJobResponse);

  // GetPublicJob is the public careers read: the job as candidates see it, with the
  // frozen application form. No authentication; cacheable by the BFF.
  rpc GetPublicJob(GetPublicJobRequest) returns (GetPublicJobResponse);
  // ListOpenJobs feeds the sitemap and careers listings from the global registry.
  rpc ListOpenJobs(ListOpenJobsRequest) returns (ListOpenJobsResponse);
  // CheckJobAccess tells applications whether the caller may see a job's
  // applications (job.view_all or membership of the job team).
  rpc CheckJobAccess(CheckJobAccessRequest) returns (CheckJobAccessResponse);
  // GetJobsSnapshot is the sync fallback for the applications read model: current
  // state of jobs by id, used to seed and to repair it.
  rpc GetJobsSnapshot(GetJobsSnapshotRequest) returns (GetJobsSnapshotResponse);
}

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_DRAFT = 1;
  JOB_STATUS_PENDING_APPROVAL = 2;
  JOB_STATUS_PUBLISHED = 3;
  JOB_STATUS_PAUSED = 4;
  JOB_STATUS_CLOSED = 5;
  JOB_STATUS_ARCHIVED = 6;
  JOB_STATUS_EXPIRED = 7;
}

message Job {
  string id = 1;
  string company_id = 2;
  int64 job_number = 3;
  string public_id = 4;
  string title = 5;
  JobStatus status = 6;
  string workplace_type = 7;
  repeated string market_codes = 8;
  int32 retention_months = 9;
  string created_by = 10;
  repeated string hiring_manager_ids = 11;
  google.protobuf.Timestamp published_at = 12;
  google.protobuf.Timestamp closing_at = 13;
  // JSON object with the editable job body (description, pay, skills...). Kept as
  // JSON text so the draft schema can evolve without wire changes.
  string details_json = 14;
}

message CreateDraftRequest {
  string template_id = 1;
  string details_json = 2;
}

message CreateDraftResponse {
  Job job = 1;
}

message GetJobRequest {
  string job_id = 1;
}

message GetJobResponse {
  Job job = 1;
}

message ListJobsRequest {
  repeated JobStatus statuses = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListJobsResponse {
  repeated Job jobs = 1;
  string next_page_token = 2;
}

message GateBlock {
  // Stable machine code such as "company_not_verified" (hiring/gates).
  string code = 1;
  string gate_id = 2;
  string message = 3;
}

message PublishJobRequest {
  string job_id = 1;
}

message PublishJobResponse {
  bool published = 1;
  Job job = 2;
  repeated GateBlock blocks = 3;
}

message PauseJobRequest {
  string job_id = 1;
}

message PauseJobResponse {
  Job job = 1;
}

message ResumeJobRequest {
  string job_id = 1;
}

message ResumeJobResponse {
  Job job = 1;
}

message CloseJobRequest {
  string job_id = 1;
  string reason = 2;
}

message CloseJobResponse {
  Job job = 1;
}

message GetPublicJobRequest {
  string public_id = 1;
}

message GetPublicJobResponse {
  Job job = 1;
  string company_name = 2;
  string privacy_contact_email = 3;
  string dpo_contact = 4;
  // Frozen application form version the candidate must answer.
  int32 form_version = 5;
  // JSON schema of the frozen form.
  string form_schema_json = 6;
  // OPEN, CLOSED or EXPIRED as the public page should present it.
  string public_state = 7;
}

message OpenJob {
  string public_id = 1;
  google.protobuf.Timestamp updated_at = 2;
}

message ListOpenJobsRequest {
  int32 limit = 1;
}

message ListOpenJobsResponse {
  repeated OpenJob jobs = 1;
}

message CheckJobAccessRequest {
  string job_id = 1;
}

message CheckJobAccessResponse {
  bool allowed = 1;
  // True when the caller may also change application statuses for this job.
  bool can_manage = 2;
}

message GetJobsSnapshotRequest {
  repeated string job_ids = 1;
}

message GetJobsSnapshotResponse {
  repeated Job jobs = 1;
}
