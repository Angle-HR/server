version: "2"
sql:
  - engine: "postgresql"
    queries: "db/queries"
    schema:
      - db/migrations/000001_extensions.up.sql
      - db/migrations/000002_waitlist.up.sql
      - db/migrations/000003_onboarding.up.sql
    gen:
      go:
        package: "sqlc"
        out: "internal/db/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        emit_interface: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "pg_catalog.timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            go_type: "time.Time"
